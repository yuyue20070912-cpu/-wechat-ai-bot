name: Chat and learning regression tests
on: [pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium webkit
      - run: python -m pytest -q
      - run: node tests/test_stream.js
      - run: node --check static/learning-practice.js
      - run: node --check static/learning-hub.js
      - run: node --check static/learning-mocks.js
