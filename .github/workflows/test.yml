name: Isolated application checks
on:
  push:
    branches: [ai-development]
  pull_request:
    branches: [main, ai-development]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: fishyeah_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/fishyeah_test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          TEST_PYTHON: python
