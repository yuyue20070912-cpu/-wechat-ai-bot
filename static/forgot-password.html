<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>找回密码 · fishyeah Chat</title>
<link rel="stylesheet" href="/static/password-recovery.css">
<script src="/static/password-recovery.js" defer></script>
</head>
<body>
<main>
<a class="back" href="/">← 返回登录</a>
<header><span class="brand">fishyeah Chat</span><h1>找回密码</h1><p>输入注册手机号，通过已验证的绑定邮箱找回密码。</p></header>
<ol class="steps" aria-label="找回密码进度"><li aria-current="step">1 验证身份</li><li>2 设置密码</li></ol>
<form id="verifyForm">
<label for="phone">注册手机号</label>
<input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="11" pattern="1[3-9][0-9]{9}" placeholder="输入11位中国大陆手机号" required>
<label for="code">邮箱验证码</label>
<div class="code-row"><input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6位验证码" required><button id="sendCode" type="button" class="secondary">获取验证码</button></div>
<p class="hint" id="expiry">验证码5分钟内有效。未绑定邮箱的账号，请先登录并在账号安全中绑定邮箱。</p>
<button id="verifyCode" type="submit">验证并继续</button>
</form>
<form id="resetForm" hidden>
<label for="password">新密码</label>
<input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="10–128位，包含字母及数字或符号" required>
<label for="confirm">确认新密码</label>
<input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="再次输入新密码" required>
<p class="hint">重置成功后，所有设备需要重新登录。账号数据和会员权益将保留。</p>
<button id="resetPassword" type="submit">重置密码</button>
<button id="restart" type="button" class="secondary">重新验证手机号</button>
</form>
<div id="message" role="status" aria-live="polite"></div>
<div id="success" hidden><h2>密码已重置</h2><p>所有设备已退出，请使用新密码登录。</p><a class="primary-link" href="/">返回登录</a></div>
<footer>安全验证 · 保护你的账号</footer>
</main>
</body>
</html>
