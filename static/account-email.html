<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>绑定邮箱 · fishyeah Chat</title>
<link rel="stylesheet" href="/static/password-recovery.css">
<script src="/static/account-email.js" defer></script>
</head>
<body><main>
<a class="back" href="/">← 返回账号</a>
<header><span class="brand">fishyeah Chat</span><h1>绑定找回邮箱</h1><p>验证邮箱所有权，为账号保留安全的找回方式。</p></header>
<p id="emailStatus" role="status">正在读取邮箱状态…</p>
<form id="bindForm">
<label for="email">邮箱地址</label>
<input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="输入你本人使用的邮箱" required>
<label for="currentPassword">当前密码</label>
<input id="currentPassword" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="重新输入当前密码以确认身份" required>
<button id="sendBinding" type="submit">发送邮箱验证码</button>
<p class="hint">只有验证成功才会更新绑定，更换邮箱需要再次确认当前密码。</p>
</form>
<form id="confirmForm" hidden>
<label for="bindingCode">邮箱验证码</label>
<input id="bindingCode" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="输入邮箱中的6位验证码" required>
<p class="hint" id="bindingExpiry">验证码5分钟内有效，仅可使用一次。</p>
<button id="confirmBinding" type="submit">验证并绑定邮箱</button>
<button id="editEmail" type="button" class="secondary">重新输入邮箱和密码</button>
</form>
<div id="message" role="status" aria-live="polite"></div>
<footer>邮箱仅用于账号安全与密码找回</footer>
</main></body></html>
